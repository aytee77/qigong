name: Update events from calendar

on:
  schedule:
    # Every Friday at 12:00 UTC (GitHub Actions cron is always UTC;
    # 12:00 UTC = 13:00 CET in winter, 14:00 CEST in summer)
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch events from calendar and regenerate index.html
        run: npm run update

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html
          git diff --staged --quiet || git commit -m "chore: sync Qigong events from calendar"
          git push
